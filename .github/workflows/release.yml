name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.project }} (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64,   project: RedHoleGame }
          - { os: ubuntu-latest, rid: linux-x64,   project: RedHoleEngine.Editor }
          - { os: windows-latest, rid: win-x64,    project: RedHoleGame }
          - { os: windows-latest, rid: win-x64,    project: RedHoleEngine.Editor }
          - { os: macos-latest,  rid: osx-arm64,   project: RedHoleGame }
          - { os: macos-latest,  rid: osx-arm64,   project: RedHoleEngine.Editor }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: bash
        run: >
          dotnet publish ${{ matrix.project }}/${{ matrix.project }}.csproj
          -c Release -r ${{ matrix.rid }} --self-contained
          -o publish/${{ matrix.project }}-${{ matrix.rid }}

      - name: Package
        shell: bash
        run: |
          name="${{ matrix.project }}-${{ matrix.rid }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "./publish/$name/*"
          else
            (cd publish && zip -qr "../$name.zip" "$name")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ matrix.rid }}
          path: ${{ matrix.project }}-${{ matrix.rid }}.zip

  release:
    name: Create GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
